<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ForgeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Supabase (needed to update password) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F4F2EE; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }

    .card { background: #fff; border: 1px solid #E2E0DA; border-radius: 16px; padding: 40px 36px; max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.08); animation: fadeUp 0.4s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; text-decoration: none; }
    .logomark { width: 34px; height: 34px; background: #F97316; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
    .logomark svg { width: 17px; height: 17px; fill: #fff; }
    .brand { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: #1A1A1A; }

    h1 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #1A1A1A; margin-bottom: 6px; }
    .sub { font-size: 14px; color: #7A7A7A; margin-bottom: 24px; line-height: 1.5; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: #1A1A1A; margin-bottom: 6px; }

    .input-wrap { position: relative; }
    .form-input { width: 100%; padding: 11px 44px 11px 14px; border: 1px solid #E2E0DA; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1A1A1A; background: #F9F8F6; outline: none; transition: border-color 150ms, box-shadow 150ms; min-height: 48px; }
    .form-input:focus { border-color: #F97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.12); background: #fff; }
    .form-input.error { border-color: #EF4444; }

    .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #7A7A7A; padding: 4px; }
    .toggle-pw:hover { color: #1A1A1A; }
    .toggle-pw svg { width: 16px; height: 16px; display: block; }

    /* Strength */
    .pw-bars { display: flex; gap: 4px; margin-top: 8px; margin-bottom: 3px; }
    .pw-bar { flex: 1; height: 3px; background: #E2E0DA; border-radius: 2px; transition: background 300ms; }
    .pw-bar.weak   { background: #EF4444; }
    .pw-bar.fair   { background: #F59E0B; }
    .pw-bar.good   { background: #3B82F6; }
    .pw-bar.strong { background: #2D6A4F; }
    .pw-label { font-size: 11px; color: #7A7A7A; }

    .error-msg { font-size: 12px; color: #EF4444; margin-top: 4px; display: none; }
    .error-msg.show { display: block; }

    .btn-submit { width: 100%; padding: 13px; background: #F97316; color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; border: none; border-radius: 9px; cursor: pointer; margin-top: 6px; transition: background 150ms, transform 150ms; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: #EA580C; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success state */
    .success-view { display: none; text-align: center; }
    .success-icon { width: 64px; height: 64px; background: #EDFBF3; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .success-icon svg { width: 28px; height: 28px; color: #2D6A4F; }
    .success-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #1A1A1A; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: #7A7A7A; margin-bottom: 24px; }
    .btn-go { display: block; background: #1A1A1A; color: #fff; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; padding: 13px 24px; border-radius: 9px; text-decoration: none; transition: background 150ms; }
    .btn-go:hover { background: #000; }

    .global-error { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 9px; padding: 12px 16px; font-size: 13px; color: #DC2626; margin-bottom: 16px; display: none; }
    .global-error.show { display: block; }
  </style>
</head>
<body>
<div class="card">

  <a href="/login.html" class="logo">
    <div class="logomark"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13Z"/></svg></div>
    <span class="brand">ForgeAI</span>
  </a>

  <!-- Form view -->
  <div id="form-view">
    <h1>Set New Password</h1>
    <p class="sub">Enter your new password below.</p>

    <div class="global-error" id="global-error"></div>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="input-wrap">
        <input class="form-input" type="password" id="new-pw" placeholder="Min 8 characters" autocomplete="new-password">
        <button class="toggle-pw" type="button" onclick="togglePw('new-pw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="pw-bars" id="pw-bars" style="display:none">
        <div class="pw-bar" id="b1"></div><div class="pw-bar" id="b2"></div>
        <div class="pw-bar" id="b3"></div><div class="pw-bar" id="b4"></div>
      </div>
      <div class="pw-label" id="pw-label" style="display:none">Weak</div>
      <div class="error-msg" id="err-pw">Password must be at least 8 characters</div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <div class="input-wrap">
        <input class="form-input" type="password" id="confirm-pw" placeholder="Repeat new password" autocomplete="new-password">
        <button class="toggle-pw" type="button" onclick="togglePw('confirm-pw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="error-msg" id="err-confirm">Passwords do not match</div>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="handleReset()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-label">Set New Password</span>
    </button>
  </div>

  <!-- Success view -->
  <div class="success-view" id="success-view">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Password Updated!</div>
    <p class="success-sub">Your password has been changed. You can now log in with your new password.</p>
    <a href="/login.html" class="btn-go">Go to Login →</a>
  </div>

</div>

<script>
  // Password strength
  document.getElementById('new-pw').addEventListener('input', function() {
    const val = this.value;
    const bars  = document.getElementById('pw-bars');
    const label = document.getElementById('pw-label');
    if (!val) { bars.style.display='none'; label.style.display='none'; return; }
    bars.style.display='flex'; label.style.display='block';
    const score = pwScore(val);
    const levels = ['','weak','fair','good','strong'];
    const labels = ['','Weak','Fair','Good','Strong'];
    ['b1','b2','b3','b4'].forEach((id, i) => {
      document.getElementById(id).className = 'pw-bar ' + (i < score ? levels[score] : '');
    });
    label.textContent = labels[score];
  });

  function pwScore(pw) {
    let s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(s, 4);
  }

  function togglePw(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  // Handle reset
  async function handleReset() {
    const newPw     = document.getElementById('new-pw').value;
    const confirmPw = document.getElementById('confirm-pw').value;
    let valid = true;

    // Clear errors
    ['err-pw','err-confirm','global-error'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });
    ['new-pw','confirm-pw'].forEach(id => {
      document.getElementById(id).classList.remove('error');
    });

    if (newPw.length < 8) {
      document.getElementById('err-pw').classList.add('show');
      document.getElementById('new-pw').classList.add('error');
      valid = false;
    }

    if (newPw !== confirmPw) {
      document.getElementById('err-confirm').classList.add('show');
      document.getElementById('confirm-pw').classList.add('error');
      valid = false;
    }

    if (!valid) return;

    // Loading state
    const btn     = document.getElementById('btn-submit');
    const spinner = document.getElementById('spinner');
    const label   = document.getElementById('btn-label');
    btn.disabled = true;
    spinner.classList.add('show');
    label.textContent = 'Updating...';

    try {
      // Supabase: update password
      // The reset link from email automatically sets the session
      const { error } = await window.supabase.auth.updateUser({
        password: newPw
      });

      if (error) throw error;

      // Show success
      document.getElementById('form-view').style.display    = 'none';
      document.getElementById('success-view').style.display = 'block';

    } catch (err) {
      document.getElementById('global-error').textContent = err.message || 'Something went wrong. Please try again.';
      document.getElementById('global-error').classList.add('show');
      btn.disabled = false;
      spinner.classList.remove('show');
      label.textContent = 'Set New Password';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleReset();
  });
</script>

</body>
</html>
