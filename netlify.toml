# ═══════════════════════════════════════════════════════════════
# ConversionOS — Netlify Configuration
# ═══════════════════════════════════════════════════════════════

# ── BUILD SETTINGS ───────────────────────────────────────────────
[build]
  publish = "."
  functions = "netlify/functions"


# ── SECURITY HEADERS ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://ipapi.co https://api.resend.com https://api.cashfree.com https://sandbox.cashfree.com https://api.gumroad.com https://cdn.jsdelivr.net https://unpkg.com https://sdk.cashfree.com; img-src 'self' data: https:; frame-src https://sdk.cashfree.com https://*.cashfree.com; frame-ancestors 'none';"


# ── CACHE HEADERS ────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/supabase.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"


# ── REDIRECTS ────────────────────────────────────────────────────
# Force HTTPS
[[redirects]]
  from = "http://aiconversionengine.io/*"
  to = "https://aiconversionengine.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aiconversionengine.io/*"
  to = "https://aiconversionengine.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aiconversionengine.io/*"
  to = "https://aiconversionengine.io/:splat"
  status = 301
  force = true

